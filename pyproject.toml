[project]
name = "tony-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21",
    "github-copilot-sdk>=0.2",
    "mcp[cli]>=1.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
