[tool.poetry]
name = "tony-ai"
version = "0.1.0"
description = "AI agent powered by GitHub Copilot"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "tony_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
slack-bolt = "^1.21"
github-copilot-sdk = "^0.2"
mcp = {version = "^1.27", extras = ["cli"]}
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
pytest-asyncio = "*"

[tool.poetry.scripts]
tony_ai = "tony_ai.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
